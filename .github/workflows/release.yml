name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish and verify
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --generate-notes \
              --title "PAM Native Nitro ${RELEASE_TAG}"

      - name: Publish on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          test -n "${PACKAGIST_USERNAME}"
          test -n "${PACKAGIST_TOKEN}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            --header 'User-Agent: push-in/pam-native-nitro release automation' \
            --data '{"repository":"https://github.com/push-in/pam-native-nitro"}' \
            https://packagist.org/api/update-package

      - name: Verify Packagist publication
        run: |
          for attempt in $(seq 1 12); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --output "${RUNNER_TEMP}/packagist.json" \
              https://repo.packagist.org/p2/pushinbr/pam-native-nitro.json \
              && php -r '
                $metadata = json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR);
                $versions = $metadata["packages"]["pushinbr/pam-native-nitro"] ?? [];
                foreach ($versions as $version) {
                    if (($version["version"] ?? null) === getenv("RELEASE_TAG")) {
                        exit(0);
                    }
                }
                exit(1);
              ' "${RUNNER_TEMP}/packagist.json"; then
              exit 0
            fi
            sleep 10
          done
          echo "Packagist did not expose ${RELEASE_TAG} within the publication window" >&2
          exit 1
