name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "PAM Native Nitro ${GITHUB_REF_NAME}"

      - name: Verify Packagist publication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --output "${RUNNER_TEMP}/packagist.json" \
              https://repo.packagist.org/p2/pushinbr/pam-native-nitro.json \
              && php -r '
                $metadata = json_decode(file_get_contents($argv[1]), true, flags: JSON_THROW_ON_ERROR);
                $versions = $metadata["packages"]["pushinbr/pam-native-nitro"] ?? [];
                foreach ($versions as $version) {
                    if (($version["version"] ?? null) === getenv("RELEASE_TAG")) {
                        exit(0);
                    }
                }
                exit(1);
              ' "${RUNNER_TEMP}/packagist.json"; then
              exit 0
            fi
            sleep 10
          done
          echo "Packagist did not expose ${RELEASE_TAG} within the publication window" >&2
          exit 1
