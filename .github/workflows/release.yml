name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --generate-notes
          --title "PAM Native Nitro ${GITHUB_REF_NAME}"

      - name: Publish on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          test -n "${PACKAGIST_USERNAME}"
          test -n "${PACKAGIST_TOKEN}"
          payload='{"repository":{"url":"https://github.com/push-in/pam-native-nitro"}}'
          username=$(php -r 'echo rawurlencode((string) getenv("PACKAGIST_USERNAME"));')
          token=$(php -r 'echo rawurlencode((string) getenv("PACKAGIST_TOKEN"));')
          endpoint="https://packagist.org/api"
          if ! curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --request POST --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${endpoint}/update-package?username=${username}&apiToken=${token}"; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --request POST --header 'Content-Type: application/json' \
              --data "${payload}" \
              "${endpoint}/create-package?username=${username}&apiToken=${token}"
          fi
