name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer analyse
      - run: composer test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "PAM Native Nitro ${GITHUB_REF_NAME}"

      - name: Publish on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          test -n "${PACKAGIST_USERNAME}"
          test -n "${PACKAGIST_TOKEN}"
          payload='{"repository":{"url":"https://github.com/push-in/pam-native-nitro"}}'
          username=$(php -r 'echo rawurlencode((string) getenv("PACKAGIST_USERNAME"));')
          token=$(php -r 'echo rawurlencode((string) getenv("PACKAGIST_TOKEN"));')
          endpoint="https://packagist.org/api"
          request() {
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --request POST --header 'Content-Type: application/json' \
              --data "${payload}" "$1"
          }
          update_url="${endpoint}/update-package?username=${username}&apiToken=${token}"
          create_url="${endpoint}/create-package?username=${username}&apiToken=${token}"
          if ! request "${update_url}"; then
            if ! request "${create_url}"; then
              request "${update_url}"
            fi
          fi
